<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TH Gym &amp; Fitness - Quản lý phòng gym nhiều chi nhánh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F5F5F6;--surface:#FFFFFF;--surface-2:#F4F4F5;--ink:#18181B;--muted:#71717A;--line:#E4E4E7;
  --side:#FFFFFF;--side-ink:#18181B;--side-muted:#71717A;--side-hover:#F4F4F5;--side-active:#EFEFF1;
  --brand:#EA580C;--brand-soft:#FFEDD5;
  --nb:#0D9488;--nb-soft:#CCFBF1;--nb-ink:#0F766E;--q7:#1D4E89;--q7-soft:#DBEAFE;--q7-ink:#1E40AF;--all:#EA580C;
  --ok:#15803D;--ok-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--bad:#B91C1C;--bad-soft:#FEE2E2;
  --c1:#EA580C;--c2:#0D9488;--c3:#164E63;--c4:#F59E0B;--c5:#94A3B8;--c6:#BE185D;
  --btn-bg:#18181B;--btn-ink:#FFFFFF;--overlay:rgba(9,9,11,.5);--shadow:0 1px 2px rgba(0,0,0,.05);
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-disp:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B0B0D;--surface:#151518;--surface-2:#1C1C20;--ink:#F4F4F5;--muted:#A1A1AA;--line:#2A2A30;
    --side:#111114;--side-ink:#F4F4F5;--side-muted:#A1A1AA;--side-hover:#1C1C20;--side-active:#26262B;
    --brand:#FB923C;--brand-soft:#431407;
    --nb:#2DD4BF;--nb-soft:#134E4A;--nb-ink:#5EEAD4;--q7:#60A5FA;--q7-soft:#1E3A5F;--q7-ink:#93C5FD;--all:#FB923C;
    --ok:#4ADE80;--ok-soft:#14301F;--warn:#FBBF24;--warn-soft:#3A2A0A;--bad:#F87171;--bad-soft:#401818;
    --c1:#FB923C;--c2:#2DD4BF;--c3:#38BDF8;--c4:#FBBF24;--c5:#A1A1AA;--c6:#F472B6;
    --btn-bg:#F4F4F5;--btn-ink:#09090B;--overlay:rgba(0,0,0,.65);--shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B0B0D;--surface:#151518;--surface-2:#1C1C20;--ink:#F4F4F5;--muted:#A1A1AA;--line:#2A2A30;
  --side:#111114;--side-ink:#F4F4F5;--side-muted:#A1A1AA;--side-hover:#1C1C20;--side-active:#26262B;
  --brand:#FB923C;--brand-soft:#431407;
  --nb:#2DD4BF;--nb-soft:#134E4A;--nb-ink:#5EEAD4;--q7:#60A5FA;--q7-soft:#1E3A5F;--q7-ink:#93C5FD;--all:#FB923C;
  --ok:#4ADE80;--ok-soft:#14301F;--warn:#FBBF24;--warn-soft:#3A2A0A;--bad:#F87171;--bad-soft:#401818;
  --c1:#FB923C;--c2:#2DD4BF;--c3:#38BDF8;--c4:#FBBF24;--c5:#A1A1AA;--c6:#F472B6;
  --btn-bg:#F4F4F5;--btn-ink:#09090B;--overlay:rgba(0,0,0,.65);--shadow:none;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--cur,var(--ink));outline-offset:2px}
.app{--cur:var(--all);min-height:100vh;display:grid;grid-template-columns:256px minmax(0,1fr)}
.main{min-width:0}

/* sidebar */
.side{background:var(--side);color:var(--side-ink);border-right:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.bl{width:34px;height:34px;border-radius:9px;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.bn{font:700 15px/1.1 var(--f-body);letter-spacing:-.01em}
.bs{font-size:10.5px;letter-spacing:.08em;color:var(--side-muted);text-transform:uppercase;margin-top:3px}
.mbtn{display:none;margin-left:auto;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.sbody{display:flex;flex-direction:column;padding:0 10px 12px;flex:1}
.nsec{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:8px 10px;border-radius:8px;font:500 14px var(--f-body);cursor:pointer;text-align:left}
.nav button svg{flex:none;color:var(--side-muted)}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="true"]{background:var(--side-active);font-weight:600}
.nav button[aria-current="true"] svg{color:var(--cur)}
.user{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.urow{display:flex;gap:10px;align-items:center}
.avt{width:34px;height:34px;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.urow b{display:block;font-size:13.5px;font-weight:600}
.urow span{font-size:12px;color:var(--side-muted)}
.user select{width:100%;padding:7px 10px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);font:400 13px var(--f-body)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--surface);border-top:3px solid var(--cur);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;flex-wrap:wrap}
.gs{position:relative;flex:1;max-width:400px;min-width:220px}
.gs .gi{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}
.gs input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:400 14px var(--f-body)}
.gs input::placeholder{color:var(--muted)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:320px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:60vh;overflow:auto;z-index:40}
.gres .li{cursor:pointer;padding:9px 14px}
.gres .li:hover{background:var(--surface-2)}
.gres .gh{padding:8px 14px 2px;font-size:12px;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:10px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font:500 13px var(--f-body);color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 0 0 1px var(--pill,var(--line))}
.seg .b-all{--pill:var(--all)}.seg .b-nb{--pill:var(--nb)}.seg .b-q7{--pill:var(--q7)}
.lock{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-weight:500;font-size:13px}
.lock span{color:var(--muted);font-weight:400;font-size:12.5px}
.content{padding:20px 24px 56px;max-width:1400px;margin:0 auto}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.ph h1{margin:0;font:700 32px/1.05 var(--f-disp);letter-spacing:.2px}
.ph .sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* panels, tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.panel>h2{margin:0;padding:13px 18px;font:600 15px var(--f-body);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel>h2 small{font-weight:400;color:var(--muted);font-size:13px}
.pb{padding:14px 18px}
.empty{padding:22px 18px;color:var(--muted)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{font-size:12.5px;color:var(--muted)}
tfoot td{font-weight:600;background:var(--surface-2)}
.nowrap{white-space:nowrap}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.mb16{margin-bottom:16px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
.kpi{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kl{color:var(--muted);font-size:13px}
.kv{font:700 34px/1.1 var(--f-disp);letter-spacing:.2px;margin:4px 0 5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kb{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted);min-height:19px}
.bd{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--all)}
.dot.nb{background:var(--nb)}.dot.q7{background:var(--q7)}
.up{color:var(--ok)}.dn{color:var(--bad)}

/* score */
.score{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:center}
.sv{font:700 88px/1 var(--f-disp);letter-spacing:-1px}
.sv small{font-size:26px;color:var(--muted);font-weight:600}
.sv.ok{color:var(--ok)}.sv.warn{color:var(--warn)}.sv.bad{color:var(--bad)}
.comp{display:grid;gap:11px}
.comp .r{display:grid;grid-template-columns:80px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13.5px}
.cbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.cbar i{display:block;height:100%;background:var(--cur)}
.alert{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:600}
.alert .d{font-size:13px;color:var(--muted);margin-top:2px}
.alert .imp{font-size:12.5px;font-weight:500;margin-top:6px;display:inline-block}

/* charts */
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.hrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0}
.hm{font-weight:500;font-size:13px;color:var(--muted)}
.hrow.now .hm{color:var(--ink);font-weight:600}
.hbars{display:flex;flex-direction:column;gap:4px}
.hb{display:flex;align-items:center;gap:8px}
.track{flex:1;min-width:0}
.track i{display:block;height:12px;border-radius:2px;min-width:2px}
.hb b{width:72px;text-align:right;font:500 12px var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted)}
.heat{display:grid;grid-template-columns:30px repeat(24,minmax(8px,1fr));gap:2px;font-size:11px;color:var(--muted);align-items:center}
.heat i{display:block;aspect-ratio:1;border-radius:2px;background:var(--cur)}
.heat .hl{text-align:center;font-size:10.5px}
.hours{display:flex;align-items:flex-end;gap:3px;height:110px}
.hours i{flex:1;background:var(--cur);border-radius:2px 2px 0 0;min-height:2px}
.hlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.donutw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.leg2{display:grid;gap:8px;font-size:13.5px;flex:1;min-width:160px}
.leg2 div{display:flex;align-items:center;gap:8px}
.leg2 b{margin-left:auto;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.prog{display:flex;align-items:center;gap:8px;min-width:130px}
.prog .t{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog .t i{display:block;height:100%;background:var(--cur)}
.prog b{font-size:12.5px;width:38px;text-align:right}
.funnel{display:grid;gap:10px}
.funnel .r{display:grid;grid-template-columns:90px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13.5px}
.funnel .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.funnel .t i{display:block;height:100%;background:var(--cur)}
.rank{display:grid;gap:8px;font-size:13.5px}
.rank div{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rank div:last-child{border-bottom:0;padding-bottom:0}

/* tags, chips, buttons, forms */
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--all);background:var(--surface-2)}
.tag .dot{background:currentColor}
.tag.nb{color:var(--nb);background:var(--nb-soft)}
.tag.q7{color:var(--q7);background:var(--q7-soft)}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:500;white-space:nowrap;color:var(--muted);background:var(--surface-2)}
.chip.active,.chip.ok{color:var(--ok);background:var(--ok-soft)}
.chip.soon,.chip.warn,.chip.inactive,.chip.unsigned{color:var(--warn);background:var(--warn-soft)}
.chip.expired,.chip.bad,.chip.canceled{color:var(--bad);background:var(--bad-soft)}
.btn{font:500 13.5px var(--f-body);padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:400 14px var(--f-body)}
.inp:disabled{opacity:.7}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;min-width:0}
.toolbar .grow{flex:1;min-width:200px}
.spacer{flex:1}
.count{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:999px;font:500 13.5px var(--f-body);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--bad);font-size:13px;margin:0 0 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kv2{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0 0 14px;font-size:14px}
.kv2 dt{color:var(--muted)}
.kv2 dd{margin:0}
.checks{display:grid;gap:6px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.checks label{display:flex;gap:8px;align-items:center;font-weight:400}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:inline-grid;place-items:center;font-weight:600;font-size:12px;color:var(--muted);border:1px solid var(--line)}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .nm{font-weight:500}
.li .sub{font-size:12.5px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:0 0 14px}
.yes{color:var(--ok);font-weight:600}.no{color:var(--muted)}

/* check-in */
.big{font:600 20px var(--f-body);padding:12px 14px}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick .lbl{width:100%;font-size:12.5px;color:var(--muted)}
.q{border:1px dashed var(--muted);background:none;border-radius:999px;padding:4px 12px;font:400 12.5px var(--f-body);color:var(--ink);cursor:pointer}
.q:hover{background:var(--surface-2)}
.res{margin-top:16px;border:1px solid var(--line);border-left-width:8px;border-radius:8px;padding:14px 18px;background:var(--surface-2)}
.res h3{font:700 32px/1.1 var(--f-disp);margin:0 0 4px;letter-spacing:.2px}
.res .rn{font-weight:600;font-size:16px}
.res p{margin:6px 0 0}
.res .act{margin-top:12px}
.res.ok{border-left-color:var(--ok);background:var(--ok-soft)}.res.ok h3{color:var(--ok)}
.res.warn{border-left-color:var(--warn);background:var(--warn-soft)}.res.warn h3{color:var(--warn)}
.res.bad{border-left-color:var(--bad);background:var(--bad-soft)}.res.bad h3{color:var(--bad)}
.cigrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}

/* PT grid, lockers */
.ptg td,.ptg th{min-width:150px}
.ptg td:first-child,.ptg th:first-child{min-width:64px;color:var(--muted);font-variant-numeric:tabular-nums}
.ptg td{height:52px;vertical-align:top;padding:5px 6px}
.ptc{border-left:3px solid var(--cur);background:var(--surface-2);padding:4px 8px;border-radius:4px;font-size:12.5px;cursor:pointer;line-height:1.35}
.ptc.done{border-left-color:var(--ok)}.ptc.cancel{border-left-color:var(--bad)}.ptc.noshow{border-left-color:var(--warn)}
.ptc small{color:var(--muted);display:block}
.pte{min-height:40px;border-radius:4px;cursor:pointer}
.pte:hover{background:var(--surface-2)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.lk{border:1px solid var(--line);border-radius:6px;padding:6px 0;text-align:center;font-size:12px;color:var(--muted)}
.lk.used{color:var(--ink);box-shadow:inset 0 -3px 0 var(--cur);background:var(--surface-2)}
.lk.over{border-color:var(--bad);color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad)}

.ptc.live{border-left-color:var(--ok);background:var(--ok-soft)}
.pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.money{font:700 22px/1 var(--f-disp);font-variant-numeric:tabular-nums;color:var(--ok)}
.lbar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
.lbar i{display:block;height:100%;background:var(--ok)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.conn{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}

const DAY=86400000;

/* ================= Tiện ích ================= */
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/DAY);
const NOW=new Date();
const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());

const isoOff=n=>toISO(addDays(TODAY,n));
const fmtDate=s=>{const p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0];};

const fmtShort=n=>{const a=Math.abs(n);if(a>=1e9)return (n/1e9).toFixed(2).replace('.',',')+' tỷ';if(a>=1e6)return (n/1e6).toFixed(1).replace('.',',')+' tr';return Math.round(n/1000)+'k';};
const fmtPhone=p=>p.slice(0,4)+' '+p.slice(4,7)+' '+p.slice(7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

 {id:'p1',name:'Gym 1 tháng',type:'gym',unit:'time',days:30,price:500000,scope:'branch'},

 {id:'p3',name:'Gym 6 tháng',type:'gym',unit:'time',days:180,price:2200000,scope:'branch'},

 {id:'p6',name:'PT 12 buổi',type:'pt',unit:'session',days:90,sessions:12,price:3600000,scope:'branch'},

function makeMkt(r,members,contracts,plans){
  const used={};members.forEach(m=>{used[m.phone]=1;});
  const camps=[
    {id:'f1',platform:'fb',name:'Ưu đãi gói 3 tháng',branch:'nb',budget:60000,status:'active'},

function cstatus(c){
  if(c.status==='canceled')return 'canceled';
  if(!c.signed)return 'unsigned';

function metricsFor(ids){
  const inB=b=>ids.includes(b);
  const ms=data.members.filter(m=>inB(m.branch));
  const rows=ms.map(m=>({m,c:curCt(m)}));
  const live=rows.filter(x=>x.c&&['active','soon','frozen'].includes(cstatus(x.c)));
  const act=live.length;
  const d14=isoOff(-14),d30=isoOff(-30),d60=isoOff(-60),d120=isoOff(-120);
  const pays=data.payments.filter(p=>inB(p.branch));
  const rev30=sum(pays.filter(p=>p.date>d30&&p.date<=TODAY_ISO).map(p=>p.amount));
  const revPrev=sum(pays.filter(p=>p.date>d60&&p.date<=d30).map(p=>p.amount));
  const prior=sum(pays.filter(p=>p.date>d120&&p.date<=d30).map(p=>p.amount))/3;
  const ratio=prior>0?rev30/prior:1;
  const sRev=Math.round(25*clamp(ratio/1.2,0,1));
  const renewed=pays.filter(p=>p.kind==='renew'&&p.date>d30).length;
  const lapsed=rows.filter(x=>x.c&&cstatus(x.c)==='expired'&&x.c.end>=d30).length;
  const renewalRate=(renewed+lapsed)?renewed/(renewed+lapsed):0.6;
  const sMem=Math.round(25*(0.5*(act/Math.max(1,ms.length))+0.5*renewalRate));
  const sumPrice=sum(live.map(x=>x.c.price)),sumPaid=sum(live.map(x=>Math.min(x.c.paid,x.c.price)));
  const sCash=Math.round(25*(sumPrice?sumPaid/sumPrice:1));
  const lim=lastInMap();
  const engaged=live.filter(x=>lim[x.m.id]&&lim[x.m.id]>d14).length;
  const sOps=Math.round(25*clamp((act?engaged/act:0)/0.75,0,1));
  const exp30=live.filter(x=>['active','soon'].includes(cstatus(x.c))&&x.c.end<=isoOff(30));
  const quiet=exp30.filter(x=>!(lim[x.m.id]&&lim[x.m.id]>d14));
  const dc=data.contracts.filter(c=>inB(c.branch)&&c.status!=='canceled'&&c.price-c.paid>0);
  const pendingC=data.contracts.filter(c=>inB(c.branch)&&c.status!=='canceled'&&(!c.signed||!c.activated));
  return {act,total:ms.length,rev30,revPrev,renewalRate,renewed,lapsed,sRev,sMem,sCash,sOps,score:sRev+sMem+sCash+sOps,
    exp30,quiet,debtN:dc.length,debtSum:sum(dc.map(c=>c.price-c.paid)),pendingC,
    newN:ms.filter(m=>m.joined>d30).length,leftN:lapsed};
}

function spark(vals,color){
  const n=vals.length;if(n<2)return '';
  const w=240,h=46,mx=Math.max(...vals,1),mn=Math.min(...vals,0),rg=Math.max(1,mx-mn);
  const pts=vals.map((v,i)=>[i/(n-1)*w,h-5-((v-mn)/rg)*(h-14)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const id='sg'+Math.random().toString(36).slice(2,8);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.22"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path d="${line}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/><path d="${line}" fill="none" style="stroke:${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}

function donutHTML(byG){
  const total=sum(Object.values(byG)),G=Object.keys(byG).sort((a,b)=>byG[b]-byG[a]);
  let acc=0;const R=52,C=2*Math.PI*R;

  const svg=`<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Tỷ trọng doanh thu theo dịch vụ">${arcs}<text x="70" y="66" text-anchor="middle" font-size="12" style="fill:var(--muted)">30 ngày</text><text x="70" y="86" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--ink)">${fmtShort(total)}</text></svg>`;
  const leg=G.map(g=>`<div><i class="sw" style="background:${GROUP_COLORS[g]||'var(--c5)'}"></i>${g}<b>${total?Math.round(byG[g]/total*100):0}%</b></div>`).join('');
  return `<div class="donutw">${svg}<div class="leg2">${leg||'<span class="hint">Chưa có doanh thu.</span>'}</div></div>`;
}

function ciScope(days){const from=isoOff(-days);return data.checkins.filter(k=>inScope(k.branch)&&k.time.slice(0,10)>from);}
function viewCoo(){
  const list=ciScope(30).filter(k=>k.result==='ok');
  const h=Array(24).fill(0),grid=Array.from({length:7},()=>Array(24).fill(0));
  list.forEach(k=>{const hr=+k.time.slice(11,13),dow=(parseISO(k.time.slice(0,10)).getDay()+6)%7;h[hr]++;grid[dow][hr]++;});
  let best=0,bi=17;for(let i=0;i<23;i++){if(h[i]+h[i+1]>best){best=h[i]+h[i+1];bi=i;}}
  const mx=Math.max(1,...grid.map(r=>Math.max(...r)));

/* ================= Thống kê: Doanh thu theo dịch vụ ================= */
function viewRevSvc(){
  const from=ui.rsperiod==='month'?TODAY_ISO.slice(0,7)+'-01':ui.rsperiod==='30'?isoOff(-29):'0000-00-00';
  const pays=data.payments.filter(p=>inScope(p.branch)&&p.date>=from);
  const byG={},byL={};
  pays.forEach(p=>{
    byG[p.group]=(byG[p.group]||0)+p.amount;
    const o=byL[p.label]||(byL[p.label]={label:p.label,group:p.group,n:0,rev:0});
    o.rev+=p.amount;if(['new','renew','retail','locker'].includes(p.kind))o.n++;
  });
  const total=sum(Object.values(byG));
  const G=Object.keys(byG).sort((a,b)=>byG[b]-byG[a]);
  let acc=0;const R=52,C=2*Math.PI*R;
  const arcs=total>0?G.map(g=>{const f=Math.max(0,byG[g])/total,len=f*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${GROUP_COLORS[g]||'var(--c5)'}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"/>`;acc+=len;return s;}).join(''):'';
  const donut=`<svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Tỷ trọng doanh thu theo dịch vụ">${arcs}<text x="70" y="66" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--f-body)">Tổng</text><text x="70" y="86" text-anchor="middle" font-size="18" font-weight="700" fill="var(--ink)" font-family="var(--f-disp)">${fmtShort(total)}</text></svg>`;
  const leg=G.map(g=>`<div><i class="sw" style="background:${GROUP_COLORS[g]||'var(--c5)'}"></i>${g}<b>${fmtShort(byG[g])} (${total?(byG[g]/total*100).toFixed(1).replace('.',','):0}%)</b></div>`).join('');
  const rows=Object.values(byL).sort((a,b)=>b.rev-a.rev).map(o=>`<tr><td>${esc(o.label)}<div class="sub">${o.group}</div></td><td class="num">${o.n}</td><td class="num">${fmtMoney(o.rev)}</td><td class="num">${o.n?fmtMoney(o.rev/o.n):'-'}</td><td class="num">${total?(o.rev/total*100).toFixed(1).replace('.',','):0}%</td></tr>`).join('');
  const sel=`<select id="rsperiod" class="inp" aria-label="Kỳ báo cáo">${[['30','30 ngày qua'],['month','Tháng này'],['all','Toàn thời gian']].map(o=>`<option value="${o[0]}"${ui.rsperiod===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select>`;
  return head('Doanh thu theo dịch vụ','Dịch vụ nào đang gánh doanh thu. '+branchSub(),sel)+
   `<div class="g2e"><div class="panel"><h2>Tỷ trọng</h2><div class="pb"><div class="donutw">${donut}<div class="leg2">${leg||'<span class="hint">Chưa có doanh thu trong kỳ.</span>'}</div></div></div></div>
    <div class="panel"><h2>Ghi chú</h2><div class="pb"><p class="note">Số liệu lấy từ các khoản thanh toán đã ghi nhận, đã trừ tiền hoàn. "Hợp đồng" là số lần bán gói, gia hạn, vé lẻ hoặc thuê tủ. Bình quân là doanh thu chia cho số lần bán.</p></div></div></div>
    <div class="panel"><h2>Chi tiết theo gói</h2><div class="tw"><table><thead><tr><th>Dịch vụ</th><th class="num">Hợp đồng</th><th class="num">Doanh thu</th><th class="num">Bình quân</th><th class="num">Tỷ trọng</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ================= Vận hành: Check-in ================= */
function entryCheck(m,mode,b){
  const cs=data.contracts.filter(c=>c.memberId===m.id&&c.status!=='canceled');
  if(!cs.length)return {ok:false,reason:'Thẻ hết hạn'};
  let list=cs;
  if(mode==='pt'){list=cs.filter(c=>PL(c.planId).unit==='session');if(!list.length)return {ok:false,reason:'Không có gói PT'};}
  const good=list.filter(c=>['active','soon'].includes(cstatus(c)));
  if(!good.length){
    const c=list.slice().sort((a,b)=>a.end<b.end?1:-1)[0],st=cstatus(c);
    const reason=st==='unsigned'||st==='inactive'?'Chưa kích hoạt HĐ':st==='frozen'?'Hợp đồng đang bảo lưu':(PL(c.planId).unit==='session'&&c.sessionsLeft<=0?'Hết buổi':'Thẻ hết hạn');
    return {ok:false,reason,contract:c};
  }
  const here=good.filter(c=>PL(c.planId).scope==='all'||c.branch===b);
  if(!here.length)return {ok:false,reason:'Sai chi nhánh',contract:good[0]};
  return {ok:true,contract:here[0]};
}
function logDeny(m,b,reason,c){
  data.checkins.push({id:'k'+nid('k'),memberId:m?m.id:null,contractId:c?c.id:null,branch:b,zone:'Cổng chính',time:TODAY_ISO+'T'+hhmm(new Date()),out:null,auth:'Thủ công',result:'denied',reason});
}
function doCheckin(raw){
  const b=ui.ciBranch,q=String(raw||'').trim(),mode=ui.ciMode;
  if(!q){ui.ciResult={type:'bad',title:'Chưa nhập thông tin',msg:'Nhập số điện thoại hoặc mã hội viên, ví dụ 1000001.'};return;}
  const digits=q.replace(/\D/g,''),code=q.replace(/\s/g,'');
  const m=data.members.find(x=>x.code===code||(digits.length>=9&&x.phone===digits));
  if(!m){logDeny(null,b,'Không nhận diện được',null);save();ui.ciResult={type:'bad',title:'Không tìm thấy',msg:`Không có hội viên nào khớp với "${q}". Kiểm tra lại số điện thoại hoặc mã hội viên.`};return;}
  const ch=entryCheck(m,mode,b),nm=`${m.name} (${m.code})`;
  if(!ch.ok){
    logDeny(m,b,ch.reason,ch.contract);save();
    const MSG={'Thẻ hết hạn':'Gói đã hết hạn. Gia hạn để vào tập.','Chưa kích hoạt HĐ':'Hợp đồng chưa ký hoặc chưa kích hoạt. Hoàn tất hợp đồng để vào tập.','Hợp đồng đang bảo lưu':'Hợp đồng đang bảo lưu, chưa dùng được.','Hết buổi':'Gói PT đã hết buổi. Gia hạn để đặt thêm.','Không có gói PT':'Hội viên chưa có gói PT còn hiệu lực.'};
    let msg=MSG[ch.reason]||'';
    if(ch.reason==='Sai chi nhánh'){const c=ch.contract;msg=`${PL(c.planId).name} chỉ dùng tại ${BR[c.branch].name}. Hội viên cần nâng cấp lên gói toàn hệ thống để tập tại ${BR[b].name}.`;}
    ui.ciResult={type:'bad',title:ch.reason==='Sai chi nhánh'?'Sai chi nhánh':'Từ chối vào cổng',name:nm,msg,renewId:ch.reason==='Thẻ hết hạn'||ch.reason==='Hết buổi'?ch.contract.id:null};return;
  }
  const c=ch.contract,p=PL(c.planId),st=cstatus(c);
  const inside=data.checkins.filter(k=>k.memberId===m.id&&k.result==='ok'&&k.branch===b&&k.time.startsWith(TODAY_ISO)&&!k.out).pop();
  const cross=c.branch!==b?` Hội viên ${BR[c.branch].name}, gói toàn hệ thống nên được tập tại ${BR[b].name}.`:'';
  if(inside){ui.ciResult={type:'ok',title:'Đang trong phòng tập',name:nm,msg:`Hội viên đã vào lúc ${inside.time.slice(11,16)}, chưa check-out. Không tính thêm lượt.`+cross};return;}
  let ptNote='';
  if(mode==='pt'){
    c.sessionsLeft=Math.max(0,c.sessionsLeft-1);
    const ps=data.pt.find(x=>x.date===TODAY_ISO&&x.branch===b&&['booked','live'].includes(x.status)&&x.memberIds.includes(m.id));
    if(ps){if(ps.status==='booked'){ps.status='live';ps.startedAt=Date.now();}ps.ded=ps.ded||[];if(!ps.ded.includes(m.id))ps.ded.push(m.id);ptNote=' Buổi PT đã bắt đầu, lương PT tính theo thời gian thực.';}
  }
  data.checkins.push({id:'k'+nid('k'),memberId:m.id,contractId:c.id,branch:b,zone:'Phòng tạ',time:TODAY_ISO+'T'+hhmm(new Date()),out:null,auth:'Thủ công',result:'ok',reason:''});
  save();
  const soon=st==='soon';
  ui.ciResult={type:soon?'warn':'ok',title:soon?'Cho vào, sắp hết hạn':'Cho vào',name:nm,msg:`${p.name}. ${mode==='pt'?'Đã trừ 1 buổi, còn '+c.sessionsLeft+' buổi.':(p.unit==='session'?'Còn '+c.sessionsLeft+' buổi.':(dleft(c)===0?'Gói hết hạn hôm nay.':'Còn '+dleft(c)+' ngày.'))}`+cross+ptNote,renewId:soon?c.id:null};
}
function demoChips(b){
  const o=BR_IDS.find(x=>x!==b),out=[];
  const stOf=m=>mstatus(m),ctp=m=>{const c=curCt(m);return c?PL(c.planId):null;};
  const f=fn=>data.members.find(fn);
  const a=f(m=>m.branch===b&&stOf(m)==='active'&&ctp(m)&&ctp(m).scope==='branch'&&ctp(m).unit==='time');if(a)out.push(['Còn hạn',a]);
  const s=f(m=>m.branch===b&&stOf(m)==='soon');if(s)out.push(['Sắp hết hạn',s]);
  const e=f(m=>m.branch===b&&stOf(m)==='expired');if(e)out.push(['Hết hạn',e]);
  const u=f(m=>m.branch===b&&['unsigned','inactive'].includes(stOf(m)));if(u)out.push(['Chưa kích hoạt',u]);
  const x=f(m=>m.branch===o&&stOf(m)==='active'&&ctp(m)&&ctp(m).scope==='branch'&&ctp(m).unit==='time');if(x)out.push(['Gói chi nhánh '+BR[o].name,x]);
  const y=f(m=>m.branch===o&&['active','soon'].includes(stOf(m))&&ctp(m)&&ctp(m).scope==='all');if(y)out.push(['Toàn hệ thống, từ '+BR[o].name,y]);
  return out;
}

function savePT(){
  const tid=$('#pt-trainer').value,date=$('#pt-date').value,hour=+$('#pt-hour').value,type=$('#pt-type').value;
  const ids=[...document.querySelectorAll('input[name="ptm"]:checked')].map(x=>x.value);
  if(!date)return setErr('Chọn ngày.');
  if(type==='1-1'&&ids.length!==1)return setErr('Buổi 1-1 cần chọn đúng 1 hội viên.');
  if(type==='Nhóm'&&ids.length<2)return setErr('Buổi nhóm cần chọn từ 2 hội viên.');
  if(data.pt.some(s=>s.trainerId===tid&&s.date===date&&s.hour===hour))return setErr('Huấn luyện viên đã có buổi vào giờ này.');
  const t=TRAINERS.find(x=>x.id===tid);
  data.pt.push({id:'s'+nid('t'),trainerId:tid,branch:t.branch,date,hour,type,memberIds:ids,status:'booked'});
  ui.ptDate=date;save();closeModal();render();toast('Đã thêm buổi PT lúc '+pad(hour)+':00');
}
const payFull=(s,cfg)=>s.type==='Nhóm'?cfg.rateGroup*s.memberIds.length:cfg.rate1;
function sessionEarn(s,cfg){
  if(s.status==='done')return payFull(s,cfg);
  if(s.status==='noshow')return Math.round(payFull(s,cfg)*data.payroll.noshowPct/100);
  if(s.status==='live')return Math.round(payFull(s,cfg)*clamp((Date.now()-(s.startedAt||Date.now()))/60000,0,60)/60);
  return 0;
}
function openPTSession(id){
  const s=data.pt.find(x=>x.id===id),t=TRAINERS.find(x=>x.id===s.trainerId);
  const ms=s.memberIds.map(MB).filter(Boolean),owner=ui.role==='owner',cfg=data.payroll.per[t.id];
  let btns='<button class="btn" data-action="close">Đóng</button>';
  if(s.status==='booked'){
    btns=`<button class="btn danger" data-action="pt-set" data-id="${id}" data-st="cancel">Huỷ buổi</button><button class="btn" data-action="pt-set" data-id="${id}" data-st="noshow">Vắng mặt</button>${s.date===TODAY_ISO?`<button class="btn" data-action="pt-set" data-id="${id}" data-st="live">Bắt đầu buổi</button>`:''}<button class="btn primary" data-action="pt-set" data-id="${id}" data-st="done">Hoàn thành, trừ buổi</button>`;
  }else if(s.status==='live')btns=`<button class="btn primary" data-action="pt-set" data-id="${id}" data-st="done">Kết thúc buổi, trừ buổi</button>`;
  const pay=owner?`<dt>Lương PT</dt><dd>${['done','live','noshow'].includes(s.status)?fmtMoney(sessionEarn(s,cfg)):'Khi hoàn thành: '+fmtMoney(payFull(s,cfg))}</dd>`:'';
  openModal('Buổi PT '+pad(s.hour)+':00',`<dl class="kv2"><dt>Huấn luyện viên</dt><dd>${esc(t.name)} ${tagHTML(t.branch)}</dd><dt>Ngày</dt><dd>${fmtDate(s.date)}</dd><dt>Loại</dt><dd>${s.type}</dd><dt>Trạng thái</dt><dd><span class="chip ${s.status==='done'||s.status==='live'?'ok':s.status==='booked'?'':'warn'}">${PT_ST[s.status][0]}</span></dd>${pay}</dl><h4>Hội viên</h4><ul class="mini">${ms.map(m=>{const c=data.contracts.find(c=>c.memberId===m.id&&PL(c.planId).unit==='session'&&c.status==='active');return `<li><span>${esc(m.name)} (${m.code})</span><span>${c?'còn '+c.sessionsLeft+' buổi':''}</span></li>`;}).join('')}</ul>`,btns);
}
function setPT(id,st){
  const s=data.pt.find(x=>x.id===id);if(!s||!['booked','live'].includes(s.status))return;
  const t=TRAINERS.find(x=>x.id===s.trainerId),cfg=data.payroll.per[t.id];
  if(st==='live'){
    if(s.status!=='booked'||s.date!==TODAY_ISO)return;
    s.status='live';s.startedAt=Date.now();s.ded=s.ded||[];
    save();closeModal();render();toast('Đã bắt đầu buổi PT'+(ui.role==='owner'?', lương PT bắt đầu tính theo thời gian thực':''));return;
  }
  if(st==='done'){
    s.ded=s.ded||[];
    s.memberIds.forEach(mid=>{if(s.ded.includes(mid))return;const c=data.contracts.find(c=>c.memberId===mid&&PL(c.planId).unit==='session'&&c.status==='active'&&c.sessionsLeft>0);if(c)c.sessionsLeft--;s.ded.push(mid);});
    s.status='done';s.endedAt=Date.now();
    save();closeModal();render();toast('Đã kết thúc buổi và trừ buổi từng hội viên'+(ui.role==='owner'?'. Lương PT +'+fmtMoney(payFull(s,cfg)):''));return;
  }
  s.status=st;save();closeModal();render();toast('Đã cập nhật buổi PT');
}

function rentStatus(r){
  if(r.returned)return ['Đã trả','ok'];
  if(r.kind==='locker'&&r.type==='Tủ đồ tháng'){const dl=daysBetween(TODAY_ISO,r.due);return dl<0?['Quá hạn '+(-dl)+' ngày','bad']:['Còn hạn','active'];}
  const od=daysBetween(r.start,TODAY_ISO);return od>0?['Quá hạn '+od+' ngày','bad']:['Đang mượn','warn'];
}

/* ================= Khách hàng: Hội viên ================= */
function membersList(){
  let l=data.members.filter(m=>inScope(m.branch));
  const q=norm(ui.mq.trim()),qd=ui.mq.replace(/\D/g,'');
  if(q)l=l.filter(m=>norm(m.name).includes(q)||m.code.includes(q.replace(/\s/g,''))||(qd&&m.phone.includes(qd)));
  if(ui.mstatus!=='all')l=l.filter(m=>mstatus(m)===ui.mstatus);
  const key=m=>{const c=curCt(m);if(!c)return 1e6;const dl=dleft(c);return dl>=0?dl:1e5-dl;};
  return l.sort((a,b)=>key(a)-key(b));
}

/* ================= Khách hàng: Phiếu ================= */
function phieuCalc(type,c,pl){
  const old=PL(c.planId);
  switch(type){
    case 'Gia hạn':{const p=PL(pl.planId);return {fee:p.price,desc:'Gia hạn '+p.name};}
    case 'Bảo lưu':return {fee:0,desc:`Bảo lưu ${pl.days} ngày`};
    case 'Nâng cấp':{const p=PL(pl.planId);return {fee:Math.max(0,p.price-old.price),desc:`Nâng cấp lên ${p.name}, tính bù tiền`};}
    case 'Hạ cấp':{const p=PL(pl.planId);return {fee:-Math.round(Math.max(0,old.price-p.price)*remainFrac(c)/1000)*1000,desc:`Hạ cấp xuống ${p.name}, hoàn lại tiền`};}
    case 'Chuyển đổi':{const p=PL(pl.planId);return {fee:Math.max(0,p.price-Math.round(old.price*remainFrac(c)/1000)*1000),desc:`Đổi sang ${p.name}, trừ phần còn lại của gói cũ`};}
    case 'Chuyển nhượng':return {fee:500000,desc:'Sang tên cho '+pl.name};
    case 'Chuyển chi nhánh':return {fee:0,desc:'Chuyển sang '+BR[pl.branch].name};
    default:return {fee:-Math.round(c.paid*remainFrac(c)*0.9/1000)*1000,desc:'Hủy hợp đồng, hoàn phần còn lại trừ 10% phí'};
  }
}
function applyPhieu(ph){
  const c=CT(ph.contractId),old=PL(c.planId),pl=ph.payload||{};
  const calc=phieuCalc(ph.type,c,pl);ph.fee=calc.fee;ph.desc=calc.desc;
  const plus=(base,n)=>toISO(addDays(parseISO(base),n));
  switch(ph.type){
    case 'Gia hạn':{const p=PL(pl.planId),ex=dleft(c)<0;c.end=plus(ex?TODAY_ISO:c.end,p.days);if(ex)c.start=TODAY_ISO;c.planId=p.id;c.price+=p.price;if(p.unit==='session')c.sessionsLeft=(c.sessionsLeft||0)+p.sessions;c.activated=true;break;}
    case 'Bảo lưu':c.end=plus(c.end,pl.days);c.freeze={from:TODAY_ISO,to:plus(TODAY_ISO,pl.days)};break;
    case 'Nâng cấp':{const p=PL(pl.planId);c.planId=p.id;c.price=p.price;c.end=plus(c.start,p.days);if(c.end<TODAY_ISO)c.end=plus(TODAY_ISO,p.days);if(p.unit==='session')c.sessionsLeft=(c.sessionsLeft||0)+Math.max(0,p.sessions-(old.sessions||0));break;}
    case 'Hạ cấp':{const p=PL(pl.planId);c.end=plus(TODAY_ISO,Math.min(Math.max(0,dleft(c)),p.days));c.planId=p.id;c.price=p.price;break;}
    case 'Chuyển đổi':{const p=PL(pl.planId);c.planId=p.id;c.start=TODAY_ISO;c.end=plus(TODAY_ISO,p.days);c.price=p.price;c.sessionsLeft=p.unit==='session'?p.sessions:null;break;}
    case 'Chuyển nhượng':{let t=data.members.find(m=>m.phone===pl.phone);if(!t){const n=nid('m');t={id:'m'+n,code:String(1000000+n),name:pl.name,phone:pl.phone,branch:c.branch,joined:TODAY_ISO,sig:null};data.members.push(t);}c.memberId=t.id;break;}
    case 'Chuyển chi nhánh':c.branch=pl.branch;MB(c.memberId).branch=pl.branch;break;
    default:c.status='canceled';
  }
  if(PL(c.planId).type==='pt'&&!c.trainerId)c.trainerId=(TRAINERS.find(t=>t.branch===c.branch)||{}).id||null;
  if(ph.fee!==0){
    c.paid=Math.max(0,c.paid+ph.fee);
    const cp=PL(c.planId);
    data.payments.push({id:'p'+nid('p'),contractId:c.id,memberId:c.memberId,amount:ph.fee,method:ph.method||'Tiền mặt',date:TODAY_ISO,branch:ph.branch||c.branch,label:cp.name,group:GROUPS[cp.type],kind:ph.fee<0?'refund':(ph.type==='Gia hạn'?'renew':'upgrade')});
  }
  ph.paid=ph.fee;ph.status=ph.fee<0?'Đã hoàn':'Đã duyệt';
}

function phPlanFilter(type,c){
  const old=PL(c.planId);

  if(type==='Hạ cấp')return p=>p.price<old.price&&p.unit===old.unit;
  if(type==='Chuyển đổi')return p=>p.id!==old.id;
  return ()=>true;
}

function phPayload(type){
  const g=id=>{const e=$('#'+id);return e?e.value:'';};
  if(['Gia hạn','Nâng cấp','Hạ cấp','Chuyển đổi'].includes(type))return {planId:g('ph-p')};
  if(type==='Bảo lưu')return {days:parseInt(g('ph-d').replace(/\D/g,''),10)||0};
  if(type==='Chuyển nhượng')return {name:g('ph-n').trim(),phone:g('ph-ph').replace(/[\s.\-]/g,'')};

function phPreview(){
  const h=$('#ph-prev'),cid=$('#ph-c')&&$('#ph-c').value,type=$('#ph-t')&&$('#ph-t').value;if(!h||!cid)return;

  if(type==='Chuyển chi nhánh'&&!pl.branch){h.textContent='';return;}
  const r=phieuCalc(type,c,pl);

}
function savePhieu(){
  const cid=$('#ph-c').value,type=$('#ph-t').value,method=$('#ph-m').value;if(!cid)return setErr('Chọn hợp đồng.');
  const c=CT(cid),pl=phPayload(type);

  if(type==='Bảo lưu'&&!(pl.days>=7&&pl.days<=90))return setErr('Số ngày bảo lưu từ 7 đến 90.');
  if(type==='Chuyển nhượng'){if(pl.name.length<2)return setErr('Nhập tên người nhận.');if(!/^0\d{9}$/.test(pl.phone))return setErr('Số điện thoại người nhận gồm 10 chữ số, bắt đầu bằng 0.');if(pl.phone===MB(c.memberId).phone)return setErr('Người nhận trùng với hội viên hiện tại.');}
  if(type==='Chuyển chi nhánh'&&!pl.branch)return setErr('Chọn chi nhánh.');
  if(['unsigned','inactive'].includes(cstatus(c)))return setErr('Hợp đồng chưa có hiệu lực, hãy ký hoặc kích hoạt trước khi lập phiếu.');
  const calc=phieuCalc(type,c,pl),n=nid('f'),needs=!!ROLES[ui.role].branch&&NEED_APPROVAL.includes(type);
  const ph={id:'f'+n,code:PH_PREFIX[type]+String(n).padStart(5,'0'),type,contractId:cid,memberId:c.memberId,branch:actorBranch()||c.branch,date:TODAY_ISO,desc:calc.desc,fee:calc.fee,paid:0,status:needs?'Chờ duyệt':'Đã duyệt',payload:pl,method};
  data.phieu.push(ph);
  if(!needs)applyPhieu(ph);
  save();closeModal();
  if(ui.sub==='checkin')ui.ciResult={type:'ok',title:'Đã lập phiếu',name:MB(c.memberId).name,msg:`${type}: ${ph.desc}. Hội viên có thể check-in lại.`};
  render();toast(needs?`Đã gửi phiếu ${ph.code}, chờ chủ phòng gym duyệt`:`Đã lập phiếu ${ph.code}`);
}
function decidePhieu(id,ok){
  const ph=data.phieu.find(x=>x.id===id);if(!ph||ph.status!=='Chờ duyệt')return;

function mkMetrics(ids,days,platform){
  const from=isoOff(-(days-1)),M=data.mkt;
  const camps=M.campaigns.filter(c=>ids.includes(c.branch)&&M.conn[c.platform].on&&(!platform||c.platform===platform));
  const cid=new Set(camps.map(c=>c.id));
  const d=M.daily.filter(x=>cid.has(x.c)&&x.d>=from),ls=M.leads.filter(l=>cid.has(l.campaignId)&&l.time.slice(0,10)>=from);
  const spend=sum(d.map(x=>x.spend)),impr=sum(d.map(x=>x.impr)),clicks=sum(d.map(x=>x.clicks));
  const signed=ls.filter(l=>l.status==='signed'),rev=sum(signed.map(l=>l.value));
  return {spend,impr,clicks,leads:ls.length,contacted:ls.filter(l=>l.status!=='new').length,trial:ls.filter(l=>l.status==='trial'||l.status==='signed').length,signed:signed.length,rev,ctr:impr?clicks/impr:0,cpl:ls.length?spend/ls.length:0,cac:signed.length?spend/signed.length:0,roas:spend?rev/spend:0,camps};
}
function campStats(c,days){

  return {spend,impr,clicks,ctr:impr?clicks/impr:0,leads:ls.length,cpl:ls.length?spend/ls.length:0,signed,cac:signed?spend/signed:0};

  if(data.mkt.zalo.auto.welcome)zaloSend('t_welcome',[{name:l.name,phone:l.phone,branch:l.branch,leadId:l.id,params:{name:l.name,branch:BR[l.branch].name}}]);

function syncPlatform(p){
  const M=data.mkt;let nl=0;
  M.campaigns.filter(c=>c.platform===p&&c.status==='active').forEach(c=>{
    const sp=Math.max(1000,Math.round(c.budget*0.06/1000)*1000),cl=Math.max(1,Math.round(sp/(p==='fb'?3500:6500)));
    let d=M.daily.find(x=>x.c===c.id&&x.d===TODAY_ISO);
    if(!d){d={d:TODAY_ISO,c:c.id,spend:0,impr:0,clicks:0};M.daily.push(d);}
    d.spend+=sp;d.clicks+=cl;d.impr+=Math.round(cl/(p==='fb'?0.012:0.04));
    if(Math.random()<0.55){newLead(c,Math.random);nl++;}
  });
  M.conn[p].synced=Date.now();save();return nl;
}

function zResolve(phone){

  const l=data.mkt.leads.find(x=>x.phone===phone);return l?{l}:null;
}
function zDefaults(rec){
  const d={name:'',plan:'Gym 3 tháng',date:fmtDate(isoOff(7)),link:'https://gymhub.example/pay/GHD00001',code:'GHD00001',time:'18:00 hôm nay',trainer:TRAINERS[0].name,branch:'Nhà Bè',offer:'giảm 10% khi gia hạn sớm'};
  if(rec&&rec.m){const m=rec.m,c=curCt(m);d.name=m.name;d.branch=BR[m.branch].name;if(c){d.plan=PL(c.planId).name;d.date=fmtDate(c.end);d.code=c.code;d.link='https://gymhub.example/pay/'+c.code;if(c.trainerId)d.trainer=TRAINERS.find(t=>t.id===c.trainerId).name;}}
  else if(rec&&rec.l){d.name=rec.l.name;d.branch=BR[rec.l.branch].name;}

function segAudience(seg){
  const ids=scopeIds();
  if(seg==='newlead')return {tpl:'t_welcome',list:data.mkt.leads.filter(l=>ids.includes(l.branch)&&l.status==='new').map(l=>({name:l.name,phone:l.phone,branch:l.branch,leadId:l.id,params:{name:l.name,branch:BR[l.branch].name}}))};
  let aud;
  if(seg==='exp30')aud=metricsFor(ids).exp30;
  else aud=data.members.filter(m=>ids.includes(m.branch)).map(m=>({m,c:curCt(m)})).filter(x=>x.c&&cstatus(x.c)==='expired'&&daysBetween(x.c.end,TODAY_ISO)<=30);
  return {tpl:'t_renew',list:aud.map(x=>({name:x.m.name,phone:x.m.phone,branch:x.m.branch,memberId:x.m.id,params:{name:x.m.name,plan:PL(x.c.planId).name,date:fmtDate(x.c.end),link:'https://gymhub.example/pay/'+x.c.code}}))};
}
function zRecipients(){
  if(ui.zmode==='segment')return segAudience(ui.zseg2);
  const ph=(ui.zphone||'').replace(/[\s.\-]/g,'');
  if(!ph)return {tpl:ui.zt,list:[]};
  const rec=zResolve(ph),df=zDefaults(rec),tpl=ZT(ui.zt),params={};
  tpl.params.forEach(k=>{params[k]=ui.zov[k]!==undefined?ui.zov[k]:df[k];});
  if(tpl.params.includes('name'))params.name=ui.zname||df.name;
  const br=rec&&rec.m?rec.m.branch:rec&&rec.l?rec.l.branch:(actorBranch()||'nb');
  return {tpl:ui.zt,list:[{name:ui.zname||df.name||ph,phone:ph,branch:br,memberId:rec&&rec.m?rec.m.id:null,leadId:rec&&rec.l?rec.l.id:null,params}]};
}
function zReq(tpl,x){

  const body={phone:normPhone(x.phone),template_id:tpl.zid,template_data:data2,tracking_id:'GH-'+TODAY_ISO.replace(/-/g,'')+'-0001'};
  return 'POST https://business.openapi.zalo.me/message/template\naccess_token: <lưu ở máy chủ, không để ở trình duyệt>\nContent-Type: application/json\n\n'+JSON.stringify(body,null,2);
}

function zaloSend(tplId,list){
  const Z=data.mkt.zalo,tpl=ZT(tplId),out=[];
  list.forEach(x=>{
    const phone=normPhone(x.phone);let status='sent',err='';
    const miss=tpl.params.filter(k=>!String((x.params||{})[k]||'').trim());
    if(tpl.status!=='Đã duyệt'){status='error';err='Template chưa được duyệt';}
    else if(zQuotaUsed()+out.filter(e=>e.status!=='error').length>=Z.quota){status='error';err='Hết hạn mức gửi trong ngày';}
    else if(miss.length){status='error';err='Thiếu tham số: '+miss.join(', ');}
    else if(!/^84\d{9}$/.test(phone)){status='error';err='Số điện thoại không hợp lệ';}
    else if(parseInt(phone.slice(-2),10)%13===0){status='error';err='Số điện thoại chưa đăng ký Zalo';}
    const e={id:'z'+nid('z'),time:TODAY_ISO+'T'+hhmm(new Date()),raw:x.phone,phone,name:x.name,tpl:tplId,text:zRender(tpl.text,x.params),prm:x.params,status,err,branch:x.branch||actorBranch()||'nb',memberId:x.memberId||null,leadId:x.leadId||null,tracking:'GH-'+TODAY_ISO.replace(/-/g,'')+'-'+String(data.seq.z).padStart(4,'0')};
    Z.log.push(e);out.push(e);
  });
  save();
  setTimeout(()=>{out.forEach(e=>{if(e.status==='sent')e.status='delivered';});save();refreshZLog();},2500+Math.random()*1500);
  return out;
}

function payPeriod(){
  const n=new Date(),y=TODAY.getFullYear(),mo=TODAY.getMonth();
  if(ui.prperiod==='prev'){const d=new Date(y,mo-1,1),e=new Date(y,mo,0);return {from:toISO(d),to:toISO(e),frac:1,label:'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear()};}
  const f=new Date(y,mo,1),dim=new Date(y,mo+1,0).getDate();
  const frac=((TODAY.getDate()-1)+(n.getHours()*60+n.getMinutes()+n.getSeconds()/60)/1440)/dim;
  return {from:toISO(f),to:TODAY_ISO,frac,label:'Tháng '+(mo+1)+'/'+y};
}
const liveSessions=()=>data.pt.filter(s=>s.status==='live'&&inScope(s.branch));
function calcPayroll(per){
  const rows=ptTrainers().map(t=>{
    const cfg=data.payroll.per[t.id];
    const ss=data.pt.filter(s=>s.trainerId===t.id&&s.date>=per.from&&s.date<=per.to);
    const d1=ss.filter(s=>s.status==='done'&&s.type!=='Nhóm'),dg=ss.filter(s=>s.status==='done'&&s.type==='Nhóm'),ns=ss.filter(s=>s.status==='noshow'),lv=ss.filter(s=>s.status==='live');
    const n1=d1.length,ng=sum(dg.map(s=>s.memberIds.length));
    const pay1=n1*cfg.rate1,payG=ng*cfg.rateGroup,payNs=sum(ns.map(s=>sessionEarn(s,cfg))),live=sum(lv.map(s=>sessionEarn(s,cfg)));
    const cm=data.payments.filter(p=>p.group==='PT'&&p.contractId&&p.date>=per.from&&p.date<=per.to).filter(p=>{const c=CT(p.contractId);return c&&c.trainerId===t.id;});
    const comm=Math.round(sum(cm.map(p=>p.amount))*data.payroll.commissionPct/100);
    const base=Math.round(cfg.base*per.frac);
    const today=sum(data.pt.filter(s=>s.trainerId===t.id&&s.date===TODAY_ISO).map(s=>sessionEarn(s,cfg)));
    const work=pay1+payG+payNs;
    return {t,cfg,n1,ng,nns:ns.length,pay1,payG,payNs,live,work,wl:work+live,comm,base,today,cm,ss,total:base+work+live+comm};
  });
  return {rows,sum:k=>sum(rows.map(r=>r[k]))};
}
function payNumbers(P){
  const out=[['clock',new Date().toTimeString().slice(0,8)]];
  P.rows.forEach(r=>{const k=r.t.id;['work','live','base','comm','today','total'].forEach(f=>out.push([k+':'+f,fmtMoney(r[f])]));});
  ['wl','live','base','comm','today','total','work'].forEach(f=>out.push(['sum:'+f,fmtMoney(P.sum(f))]));
  liveSessions().forEach(s=>{
    const t=TRAINERS.find(x=>x.id===s.trainerId),cfg=data.payroll.per[t.id],el=Math.max(0,(Date.now()-(s.startedAt||Date.now()))/1000);
    out.push(['L'+s.id+':t',pad(Math.floor(el/60))+':'+pad(Math.floor(el%60))],['L'+s.id+':v',fmtMoney(sessionEarn(s,cfg))]);
  });
  return out;
}

function savePlan(){
  const g=id=>$('#'+id).value;const int=id=>parseInt(String(g(id)).replace(/\D/g,''),10)||0;
  const name=g('g-name').trim(),unit=g('g-unit'),price=int('g-price'),bonus=int('g-bonus');
  if(name.length<2)return setErr('Nhập tên gói.');

  let days,sessions=null;
  if(unit==='time'){const mo=int('g-months');if(!(mo>=1&&mo<=36))return setErr('Số tháng từ 1 đến 36.');days=(mo+bonus)*30;}
  else{sessions=int('g-sess');if(!(sessions>=1&&sessions<=200))return setErr('Số buổi từ 1 đến 200.');days=90;}
  data.plans.push({id:'px'+Date.now().toString(36),name,type:g('g-type'),unit,days,sessions,price,scope:g('g-scope'),bonus:bonus||undefined});
  save();closeModal();render();toast('Đã tạo gói '+name);
}
function openSell(name,price){
  const rb=ROLES[ui.role].branch,cur=rb||(ui.branch!=='all'?ui.branch:'nb');
  openModal(name,`<div class="field"><label for="s-branch">Bán tại chi nhánh</label><select id="s-branch" class="inp"${rb?' disabled':''}>${BR_IDS.map(b=>`<option value="${b}"${cur===b?' selected':''}>${BR[b].name}</option>`).join('')}</select></div>
   <div class="field"><label for="s-method">Hình thức thanh toán</label><select id="s-method" class="inp">${METHODS.map(x=>`<option>${x}</option>`).join('')}</select><span class="hint">Thu ${fmtMoney(price)}</span></div><input type="hidden" id="s-name" value="${esc(name)}"><input type="hidden" id="s-price" value="${price}">`,
   '<button class="btn" data-action="close">Hủy</button><button class="btn primary" data-primary data-action="save-ticket">Xác nhận</button>');
}
function saveTicket(){
  const b=$('#s-branch').value,name=$('#s-name').value,price=+$('#s-price').value;
  data.payments.push({id:'p'+nid('p'),contractId:null,memberId:null,amount:price,method:$('#s-method').value,date:TODAY_ISO,branch:b,label:'Vé lẻ ngày',group:'Vé lẻ',kind:'retail'});
  save();closeModal();render();toast(`Đã ghi nhận ${name} tại ${BR[b].name}`);
}
function paymentsList(){
  const mp=TODAY_ISO.slice(0,7);
  return data.payments.filter(p=>inScope(p.branch)&&(ui.pmethod==='all'||p.method===ui.pmethod)&&(ui.pperiod!=='month'||p.date.startsWith(mp))).sort((a,b)=>a.date<b.date?1:(a.date>b.date?-1:(a.id<b.id?1:-1)));
}
function paymentsTable(){
  const all=paymentsList(),l=all.slice(0,60),total=sum(all.map(p=>p.amount));
  if(!all.length)return '<div class="empty">Chưa có giao dịch nào trong bộ lọc này.</div>';
  return `<div class="tw"><table><thead><tr><th>Ngày</th><th>Hội viên</th><th>Thu tại</th><th>Dịch vụ</th><th>Hình thức</th><th class="num">Số tiền</th></tr></thead><tbody>${l.map(p=>{const m=p.memberId?MB(p.memberId):null;return `<tr><td class="nowrap">${fmtDate(p.date)}</td><td>${m?esc(m.name)+`<div class="sub">${m.code}</div>`:'<span class="hint">Khách lẻ</span>'}</td><td>${tagHTML(p.branch)}</td><td>${esc(p.label)}${p.amount<0?' <span class="chip bad">Hoàn tiền</span>':''}</td><td>${esc(p.method)}</td><td class="num">${fmtMoney(p.amount)}</td></tr>`;}).join('')}</tbody><tfoot><tr><td colspan="5">Tổng ${all.length} giao dịch${all.length>60?' (hiển thị 60 gần nhất)':''}</td><td class="num">${fmtMoney(total)}</td></tr></tfoot></table></div>`;
}
function viewPayments(){
  return head('Thanh toán',branchSub())+`<div class="toolbar"><select id="pperiod" class="inp" aria-label="Khoảng thời gian"><option value="month"${ui.pperiod==='month'?' selected':''}>Tháng này</option><option value="all"${ui.pperiod==='all'?' selected':''}>Tất cả thời gian</option></select><select id="pmethod" class="inp" aria-label="Hình thức thanh toán"><option value="all">Mọi hình thức</option>${METHODS.map(x=>`<option${ui.pmethod===x?' selected':''}>${x}</option>`).join('')}</select></div><div class="panel" id="ptable">${paymentsTable()}</div>`;
}

/* ================= Hộp thoại, toast ================= */
function openModal(title,body,foot,wide){
  closeModal();
  const el=document.createElement('div');el.className='ov';el.id='ov';
  el.innerHTML=`<div class="md${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-action="close" aria-label="Đóng">&times;</button></header><div class="mb">${body}</div>${foot?`<footer>${foot}</footer>`:''}</div>`;
  el.addEventListener('mousedown',e=>{if(e.target===el)closeModal();});
  $('#modal-root').appendChild(el);
  const f=el.querySelector('input:not([type=hidden]),select');if(f&&f.id!=='sig')f.focus();
}
function closeModal(){const o=$('#ov');if(o)o.remove();}
let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);}
function setErr(msg){const e=$('#ferr');if(e)e.textContent=msg;}

/* ================= Tìm kiếm nhanh ================= */
function gsearch(q){
  const box=$('#gres');if(!box)return;
  q=norm(q.trim());
  if(!q){box.hidden=true;box.innerHTML='';return;}
  const rb=ROLES[ui.role].branch;
  const ms=data.members.filter(m=>(!rb||m.branch===rb)&&(norm(m.name).includes(q)||m.code.includes(q.replace(/\s/g,''))||m.phone.includes(q.replace(/\D/g,'')||'x'))).slice(0,6);
  const scr=[];MODS.forEach(m=>m[2].forEach(s=>{if(norm(s[1]).includes(q)||norm(m[1]).includes(q))scr.push([s[0],s[1],m[1]]);}));
  let h='';
  if(ms.length)h+='<div class="gh">Hội viên</div>'+ms.map(m=>`<div class="li" data-action="gopen" data-kind="m" data-id="${m.id}"><div><div class="nm">${esc(m.name)}</div><div class="sub">${m.code}, ${fmtPhone(m.phone)}</div></div>${tagHTML(m.branch)}</div>`).join('');
  if(scr.length)h+='<div class="gh">Màn hình</div>'+scr.slice(0,5).map(s=>`<div class="li" data-action="gopen" data-kind="s" data-id="${s[0]}"><div><div class="nm">${s[1]}</div><div class="sub">${s[2]}</div></div></div>`).join('');
  box.innerHTML=h||'<div class="empty">Không tìm thấy kết quả.</div>';box.hidden=false;
}
function gclose(){const b=$('#gres'),i=$('#gsin');if(b){b.hidden=true;b.innerHTML='';}if(i)i.value='';}

/* ================= Sự kiện ================= */
function goSub(id){const f=findSub(id);if(!f)return;ui.mod=f.mod;ui.sub=id;ui.ciResult=null;ui.menu=false;render();window.scrollTo(0,0);}
function afterCheckin(){render();const i=$('#ciq');if(i){i.value='';i.focus();}}
document.addEventListener('click',e=>{
  if(!e.target.closest('.gs'))gclose();
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,d=el.dataset;
  switch(a){
    case 'hct':ui.hct=d.t;render();break;
    case 'menu':ui.menu=!ui.menu;render();break;
    case 'mod':{const m=MODS.find(x=>x[0]===d.mod);ui.mod=d.mod;ui.sub=m[2][0][0];ui.ciResult=null;render();window.scrollTo(0,0);break;}
    case 'sub':{const f=findSub(d.sub);if(f)ui.mod=f.mod;ui.sub=d.sub;ui.ciResult=null;ui.menu=false;render();window.scrollTo(0,0);break;}
    case 'go':goSub(d.sub);break;
    case 'branch':ui.branch=d.branch;if(ui.branch!=='all')ui.ciBranch=ui.branch;ui.ciResult=null;render();break;
    case 'reset':try{localStorage.removeItem(KEY);}catch(x){}data=seed();save();ui.ciResult=null;ui.ibSel=null;render();toast('Đã đặt lại dữ liệu mẫu');break;
    case 'close':closeModal();break;
    case 'gopen':{const k=d.kind,id=d.id;gclose();if(k==='m')openDetail(id);else goSub(id);break;}
    case 'detail':openDetail(d.id);break;
    case 'new-contract':openNewContract();break;
    case 'contract-next':contractNext();break;
    case 'contract-skip':finishContract(false);break;
    case 'contract-done':finishContract(true);break;
    case 'sig-clear':{const cv=$('#sig');if(cv&&cv.getContext)cv.getContext('2d').clearRect(0,0,cv.width,cv.height);ui.sigDrawn=false;break;}
    case 'sign':openSign(d.c);break;
    case 'activate':{const c=CT(d.c);c.activated=true;save();render();toast('Đã kích hoạt hợp đồng '+c.code);break;}
    case 'payoff':{const c=CT(d.c),debt=c.price-c.paid;c.paid=c.price;data.payments.push({id:'p'+nid('p'),contractId:c.id,memberId:c.memberId,amount:debt,method:'Tiền mặt',date:TODAY_ISO,branch:actorBranch()||c.branch,label:PL(c.planId).name,group:GROUPS[PL(c.planId).type],kind:'debt'});save();render();toast('Đã thu nợ '+fmtMoney(debt));break;}
    case 'phieu':closeModal();openPhieu(d.c,d.t);break;
    case 'save-phieu':savePhieu();break;
    case 'ph-ok':decidePhieu(d.id,true);break;
    case 'ph-no':decidePhieu(d.id,false);break;
    case 'quick':{const i=$('#ciq');if(i)i.value=d.q;doCheckin(d.q);afterCheckin();break;}
    case 'do-checkin':{const i=$('#ciq');doCheckin(i?i.value:'');afterCheckin();break;}
    case 'cimode':ui.ciMode=d.mode;ui.ciResult=null;render();break;
    case 'citab':ui.ciTab=d.tab;render();break;
    case 'checkout':{const k=data.checkins.find(x=>x.id===d.id);if(k){k.out=hhmm(new Date());save();render();toast('Đã check-out');}break;}
    case 'pt-prev':ui.ptDate=toISO(addDays(parseISO(ui.ptDate),-1));render();break;
    case 'pt-next':ui.ptDate=toISO(addDays(parseISO(ui.ptDate),1));render();break;
    case 'pt-today':ui.ptDate=TODAY_ISO;render();break;
    case 'pt-cell':if(d.id)openPTSession(d.id);else openPT(d.t,+d.h);break;
    case 'save-pt':savePT();break;
    case 'pt-set':setPT(d.id,d.st);break;
    case 'lktab':ui.lkTab=d.tab;render();break;
    case 'rent-new':openRent();break;
    case 'save-rent':saveRent();break;
    case 'rent-return':{const r=data.rentals.find(x=>x.id===d.id);if(r){r.returned=true;save();render();toast('Đã ghi nhận trả');}break;}
    case 'ib-sel':ui.ibSel=d.id;render();break;
    case 'ib-new':openInbody();break;
    case 'save-inbody':saveInbody();break;
    case 'zalo-send':{const aud=zaloAudience();if(!aud.length)break;const list=aud.map(x=>({name:x.m.name,phone:x.m.phone,branch:x.m.branch,memberId:x.m.id,params:{name:x.m.name,plan:PL(x.c.planId).name,date:fmtDate(x.c.end),link:'https://gymhub.example/pay/'+x.c.code}}));const es=zaloSend('t_renew',list);const ok=es.filter(e=>e.status!=='error').length;data.campaigns.push({id:'g'+nid('g'),date:TODAY_ISO,branch:ui.branch,segment:ZSEG[ui.zseg],count:aud.length,sent:ok,clicked:0,renewed:0});save();render();toast(`Đã gửi ${ok}/${aud.length} tin qua Zalo API (mô phỏng), xem nhật ký ở Marketing`);break;}
    case 'mk-connect':openMkConnect(d.p);break;
    case 'mk-save-connect':{const p=$('#mc-p').value,v=$('#mc-acct').value.split('|');data.mkt.conn[p]={on:true,account:v[0],name:v[1],synced:Date.now()};save();closeModal();render();toast('Đã kết nối '+SRC[p]+' (mô phỏng)');break;}
    case 'mk-disconnect':{data.mkt.conn[d.p].on=false;save();render();toast('Đã ngắt kết nối '+SRC[d.p]);break;}
    case 'mk-sync':{const n=syncPlatform(d.p);render();toast(`Đã đồng bộ ${SRC[d.p]} (mô phỏng)`+(n?`, nhận ${n} khách tiềm năng mới từ biểu mẫu quảng cáo`:''));break;}
    case 'mk-camp-toggle':{const c=data.mkt.campaigns.find(x=>x.id===d.id);if(c){c.status=c.status==='active'?'paused':'active';save();render();toast((c.status==='active'?'Đã bật lại: ':'Đã tạm dừng: ')+c.name);}break;}
    case 'lead-add':openAddLead();break;
    case 'save-lead':saveLead();break;
    case 'lead-convert':{const l=data.mkt.leads.find(x=>x.id===d.id);if(l)openNewContract({leadId:l.id,name:l.name,phone:l.phone,branch:l.branch});break;}
    case 'lead-zalo':{const l=data.mkt.leads.find(x=>x.id===d.id);if(l){ui.zmode='single';ui.zt='t_welcome';ui.zphone=l.phone;ui.zname=l.name;ui.zov={};goSub('mkzalo');}break;}
    case 'zmode':ui.zmode=d.mode;render();break;
    case 'z-send':{const r=zRecipients();if(!r.list.length){toast('Chưa có người nhận');break;}const es=zaloSend(r.tpl,r.list);const ok=es.filter(e=>e.status!=='error').length;render();toast(`Đã gửi ${ok}/${es.length} tin qua API (mô phỏng)`+(ok<es.length?', xem lỗi trong nhật ký':''));break;}
    case 'z-resend':{const e=data.mkt.zalo.log.find(x=>x.id===d.id);if(e){const es=zaloSend(e.tpl,[{name:e.name,phone:e.raw,branch:e.branch,memberId:e.memberId,leadId:e.leadId,params:e.prm}]);refreshZLog();toast(es[0].status==='error'?'Gửi lại vẫn lỗi: '+es[0].err:'Đã gửi lại');}break;}
    case 'z-sweep':zSweep();break;
    case 'pr-config':openPayConfig();break;
    case 'save-payconfig':savePayConfig();break;
    case 'payslip':openPayslip(d.t);break;
    case 'demo-live':demoLive();break;
    case 'plantab':ui.planTab=d.tab;render();break;
    case 'add-plan':openAddPlan();break;
    case 'save-plan':savePlan();break;
    case 'sell-ticket':openSell(d.n,+d.p);break;
    case 'save-ticket':saveTicket();break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='gsin')gsearch(e.target.value);
  else if(id==='msearch'){ui.mq=e.target.value;$('#mtable').innerHTML=membersTable();$('#mcount').textContent=membersList().length+' hội viên';}
  else if(id==='csearch'){ui.cq=e.target.value;$('#ctable').innerHTML=contractsTable();$('#ccount').textContent=contractsList().length+' hợp đồng';}
  else if(id==='f-paid'){e.target.dataset.touched='1';}
  else if(id==='ph-d'||id==='ph-n'||id==='ph-ph')phPreview();
  else if(id==='lsearch'){ui.mkq=e.target.value;const t=$('#ltable');if(t)t.innerHTML=leadsTable();}
  else if(id==='zname'){ui.zname=e.target.value;zPrevUpdate();}
  else if(id.startsWith('zp-')){ui.zov[id.slice(3)]=e.target.value;zPrevUpdate();}
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='role'){ui.role=v;const rb=ROLES[v].branch;ui.branch=rb||'all';if(rb)ui.ciBranch=rb;ui.ciResult=null;render();}
  else if(id==='mstatus'){ui.mstatus=v;$('#mtable').innerHTML=membersTable();$('#mcount').textContent=membersList().length+' hội viên';}
  else if(id==='cstatus'){ui.cstatus=v;$('#ctable').innerHTML=contractsTable();$('#ccount').textContent=contractsList().length+' hợp đồng';}
  else if(id==='pmethod'||id==='pperiod'){if(id==='pmethod')ui.pmethod=v;else ui.pperiod=v;$('#ptable').innerHTML=paymentsTable();}
  else if(id==='rsperiod'){ui.rsperiod=v;render();}
  else if(id==='cibranch'){ui.ciBranch=v;ui.ciResult=null;render();}
  else if(id==='phf'){ui.phf=v;render();}
  else if(id==='prperiod'){ui.prperiod=v;render();}
  else if(id==='zseg'){ui.zseg=v;render();}
  else if(id==='f-plan'){updateNewPreview(true);updateTrainerField();}
  else if(id==='f-branch')updateTrainerField();
  else if(id==='f-phone'){const ex=data.members.find(m=>m.phone===v.replace(/[\s.\-]/g,''));const h=$('#f-ex');if(h)h.textContent=ex?'Hội viên có sẵn: '+ex.name+' ('+ex.code+'). Hợp đồng mới sẽ gắn vào hồ sơ này.':'';}
  else if(id==='ph-c'||id==='ph-t')phFields();
  else if(id==='ph-p'||id==='ph-b')phPreview();
  else if(id==='pt-trainer'){const b=$('#pt-mem');if(b)b.innerHTML=ptMembersHTML(v);}
  else if(id==='g-unit'){$('#g-mrow').hidden=v==='session';$('#g-srow').hidden=v!=='session';}
  else if(id==='rn-branch'){const s=$('#rn-item');if(s)s.innerHTML=freeLockers(v);}
  else if(id==='mkdays'){ui.mkdays=+v;render();}
  else if(id==='mkf'){ui.mkf=v;render();}
  else if(id==='mks'){ui.mks=v;render();}
  else if(id==='zt'){ui.zt=v;ui.zov={};render();}
  else if(id==='zseg2'){ui.zseg2=v;render();}
  else if(id==='zphone'){ui.zphone=v;ui.zname='';ui.zov={};render();}
  else if(id==='zlf'){ui.zlf=v;refreshZLog();}
  else if(id.startsWith('za-')){data.mkt.zalo.auto[id.slice(3)]=e.target.checked;save();toast('Đã lưu cài đặt tự động hóa');}
  else if(e.target.dataset&&e.target.dataset.lead){const l=data.mkt.leads.find(x=>x.id===e.target.dataset.lead);if(l){l.status=v;save();render();toast('Đã cập nhật: '+LEAD_ST[v][0]);}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeModal();gclose();return;}
  if(e.key==='Enter'){
    if(e.target.id==='ciq'){e.preventDefault();doCheckin(e.target.value);afterCheckin();return;}
    const ov=$('#ov');
    if(ov&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&ov.contains(e.target)){const pb=ov.querySelector('[data-primary]');if(pb){e.preventDefault();pb.click();}}
  }
});
document.addEventListener('pointerdown',e=>{
  if(e.target.id!=='sig')return;
  const cv=e.target;if(cv.setPointerCapture)try{cv.setPointerCapture(e.pointerId);}catch(x){}
  sig.drawing=true;sig.last=sigPos(e);
  const ctx=cv.getContext('2d');ctx.beginPath();ctx.arc(sig.last[0],sig.last[1],1.2,0,6.3);ctx.fill();ui.sigDrawn=true;
});
document.addEventListener('pointermove',e=>{
  if(!sig.drawing||e.target.id!=='sig')return;
  const cv=e.target,ctx=cv.getContext('2d'),p=sigPos(e);
  ctx.beginPath();ctx.moveTo(sig.last[0],sig.last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();sig.last=p;
});
const endSig=()=>{sig.drawing=false;};
document.addEventListener('pointerup',endSig);
document.addEventListener('pointercancel',endSig);

setInterval(tickPay,1000);
render();
})();
</script>
</body>
